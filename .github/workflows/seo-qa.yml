name: Static SEO pilot QA
on: [push, pull_request]
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==6.1.1 beautifulsoup4==4.14.2
      - run: python3 scripts/repair_pilot.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_release.py
      - run: python3 -m unittest discover -s seo-rebuild-pack/tests -v
      - run: for script in assets/js/*.js; do node --check "$script" || exit 1; done
