name: Static SEO pilot QA
on: [push, pull_request]
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Preservation tests compare real historical production pages.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==6.1.1 beautifulsoup4==4.14.2
      - run: python3 build_site.py --validation-baseline .
      - run: python3 scripts/check_wave1_evidence.py
      - run: python3 scripts/repair_pilot.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_release.py
      - run: python3 scripts/repair_hmo_summaries.py --check
      - run: python3 -m unittest discover -s seo-rebuild-pack/tests -v
      - run: for script in assets/js/*.js; do node --check "$script" || exit 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/planning_route_jurisdiction.test.cjs tests/static_preview.test.cjs backend/planning-lead-worker/test/worker.test.js
      - run: UKPG_OUTPUT_DIR=. node scripts/tool_smoke_test.js
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile journeys
        env:
          UKPG_BASE_URL: http://127.0.0.1:8765
        run: |
          node scripts/serve_site.cjs . 8765 &
          npx playwright test tests/browser/production-journeys.spec.mjs tests/browser/research-improvements.spec.mjs --workers=2
          npx playwright test tests/browser/phase0-canary.spec.mjs --grep "preview disables analytics" --workers=2
      - name: Wave 1 source cohort accessibility and responsive reading
        env:
          UKPG_BASE_URL: http://127.0.0.1:8766
        run: |
          # The production preview from the previous step remains on 8765.
          node scripts/serve_site.cjs artifacts/phase-0-canary-site 8766 &
          npx playwright test tests/browser/wave1-evidence.spec.mjs --workers=2
      - name: Lighthouse canary budgets
        run: |
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npx lhci autorun --collect.settings.chromeFlags="--no-sandbox"
      - name: Upload canary performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-performance-${{ github.sha }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .lighthouseci/*.json
            reports/phase-0/lighthouse/
            reports/phase-0/canary-test-report.json
            reports/phase-0/playwright-report.json
