name: Phase 0 canary QA

on:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-and-browser:
    # Reviewed visual baselines use Windows fonts and Edge rendering.
    runs-on: windows-latest
    env:
      UKPG_BROWSER_EXECUTABLE: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/planning_route_jurisdiction.test.cjs tests/static_preview.test.cjs backend/planning-lead-worker/test/worker.test.js
      - run: python build_site.py --validation-baseline .
      - run: npm ci
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-0-qa-reports
          path: reports/phase-0/

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python build_site.py --validation-baseline .
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: reports/phase-0/lighthouse/

  source-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/28_source_health.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-0-source-health
          path: reports/phase-0/source-health.json
